[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-household-tasks"
version = "4.14.0"
description = "A local-first household task orchestration integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Household Tasks contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "defusedxml==0.7.1",
  "homeassistant>=2026.8.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1",
  "pytest-homeassistant-custom-component>=0.13.355",
  "pytest-xdist>=3.8",
]
dev = [
  "defusedxml==0.7.1",
  "homeassistant>=2026.8.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1",
  "pytest-homeassistant-custom-component>=0.13.355",
  "pytest-xdist>=3.8",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "ruff>=0.16",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.household_tasks --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/household_tasks"]
# The percentage gate covers deterministic domain modules. Home Assistant
# lifecycle and UI boundaries have dedicated tests but remain outside this gate.
omit = [
  "custom_components/household_tasks/__init__.py",
  "custom_components/household_tasks/bootstrap.py",
  "custom_components/household_tasks/config_flow.py",
  "custom_components/household_tasks/const.py",
  "custom_components/household_tasks/diagnostics.py",
  "custom_components/household_tasks/engine.py",
  "custom_components/household_tasks/system_health.py",
  "custom_components/household_tasks/ui.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
