[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-household-tasks"
version = "4.13.1"
description = "A local-first household task orchestration integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Household Tasks contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
  "defusedxml==0.7.1",
  "homeassistant>=2024.10.0",
  # pycares 4.9+ starts a process-wide shutdown thread on client cleanup, which
  # pytest-homeassistant-custom-component currently reports as a leaked thread.
  "pycares>=4,<4.9; python_version < '3.14'",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-homeassistant-custom-component>=0.13.190",
  "pytest-xdist>=3.6",
]
dev = [
  "defusedxml==0.7.1",
  "homeassistant>=2024.10.0",
  "pycares>=4,<4.9; python_version < '3.14'",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-homeassistant-custom-component>=0.13.190",
  "pytest-xdist>=3.6",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "ruff>=0.9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.household_tasks --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/household_tasks"]
# The percentage gate covers deterministic domain modules. Home Assistant
# lifecycle and UI boundaries have dedicated tests but remain outside this gate.
omit = [
  "custom_components/household_tasks/__init__.py",
  "custom_components/household_tasks/bootstrap.py",
  "custom_components/household_tasks/config_flow.py",
  "custom_components/household_tasks/const.py",
  "custom_components/household_tasks/diagnostics.py",
  "custom_components/household_tasks/engine.py",
  "custom_components/household_tasks/system_health.py",
  "custom_components/household_tasks/ui.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
